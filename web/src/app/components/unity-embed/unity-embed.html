<div class="bg-slate-900 rounded border border-slate-700 flex-1 flex flex-col overflow-hidden">
  <div class="flex-1 bg-black rounded flex items-center justify-center relative min-h-0">
    <!-- Unity Canvas -->
    <canvas
      id="unity-canvas"
      class="rounded"
      style="width: 100%; height: 100%; display: block; max-height: 100%;"
    ></canvas>

    <!-- Loading Spinner -->
    @if (loading()) {
      <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/50 rounded">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-600 border-t-blue-500"></div>
        <p class="mt-4 text-slate-300">Loading simulation...</p>
        <p class="text-xs text-slate-500 mt-2">{{ (loadingProgress() * 100).toFixed(0) }}%</p>
      </div>
    }
  </div>

  <!-- Controls -->
  <div class="border-t border-slate-700 p-3 bg-slate-800 flex gap-2 justify-end">
    <button
      (click)="pauseSimulation()"
      [disabled]="!isSimRunning()"
      class="bg-slate-700 hover:bg-slate-600 disabled:opacity-50 px-3 py-1 rounded text-xs font-semibold transition"
    >
      Pause
    </button>
    <button
      (click)="resetSimulation()"
      [disabled]="!isSimRunning()"
      class="bg-slate-700 hover:bg-slate-600 disabled:opacity-50 px-3 py-1 rounded text-xs font-semibold transition"
    >
      Reset
    </button>
    <button
      (click)="startSimulation()"
      [disabled]="!store.selectedRun() || isSimRunning()"
      class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 px-3 py-1 rounded text-xs font-semibold transition"
    >
      {{ isSimRunning() ? 'Running...' : 'Start Simulation' }}
    </button>
  </div>
</div>
